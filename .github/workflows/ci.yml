name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # The browser test skips itself when it cannot find a Chromium, so it is
      # worth pointing it at the one every runner already ships with.
      - name: Locate Chromium
        shell: bash
        run: |
          for candidate in \
            "/usr/bin/google-chrome" \
            "/usr/bin/chromium-browser" \
            "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"; do
            if [ -f "$candidate" ]; then
              echo "SLACKEN_TEST_CHROME=$candidate" >> "$GITHUB_ENV"
              echo "using $candidate"
              exit 0
            fi
          done
          echo "no chromium found; the browser test will skip itself"

      - run: npm test

  installer:
    name: installer is well-formed
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Shell syntax
        run: bash -n install.sh

      - name: Install for real, without the login agent
        run: ./install.sh

      # The installer links `slacken` onto PATH; prove the command actually runs.
      # `doctor` exits non-zero here because a CI runner has no Slack.app, so
      # check the output rather than the exit code.
      - name: The installed command works
        run: |
          set -o pipefail
          slacken doctor | tee doctor.txt || true
          grep -q "claude on PATH" doctor.txt
          slacken help | grep -q "slacken agent install"

      - name: Uninstall cleanly
        run: |
          ./install.sh --uninstall
          if command -v slacken >/dev/null 2>&1; then
            echo "slacken should be gone after --uninstall"; exit 1
          fi
