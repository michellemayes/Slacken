name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # The browser test skips itself when it cannot find a Chromium, so it is
      # worth pointing it at the one every runner already ships with.
      - name: Locate Chromium
        shell: bash
        run: |
          for candidate in \
            "/usr/bin/google-chrome" \
            "/usr/bin/chromium-browser" \
            "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"; do
            if [ -f "$candidate" ]; then
              echo "SLACKEN_TEST_CHROME=$candidate" >> "$GITHUB_ENV"
              echo "using $candidate"
              exit 0
            fi
          done
          echo "no chromium found; the browser test will skip itself"

      - run: npm test

  menubar:
    name: menu bar helper builds
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # The helper is AppKit, so nothing but a real Mac can tell us whether it
      # still compiles. Build it the way the daemon does, through the same code.
      - name: swiftc builds it, through buildHelper()
        run: |
          node --input-type=module -e "
            import { buildHelper } from './src/menubar.js';
            const binary = await buildHelper();
            console.log('built', binary);
          "

      # A second call must be a cache hit, not a second compile: the daemon
      # calls this on every start.
      - name: A rebuild reuses the cached binary
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            import { buildHelper } from './src/menubar.js';
            const first = await buildHelper();
            const stamp = fs.statSync(first).mtimeMs;
            const second = await buildHelper();
            if (second !== first) throw new Error('same source should give the same binary');
            if (fs.statSync(second).mtimeMs !== stamp) throw new Error('it recompiled instead of reusing');
            console.log('reused', second);
          "

  installer:
    name: installer is well-formed
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Shell syntax
        run: bash -n install.sh

      - name: Install for real, without the login agent
        run: ./install.sh

      # The installer links `slacken` onto PATH; prove the command actually runs.
      # `doctor` exits non-zero here because a CI runner has no Slack.app, so
      # check the output rather than the exit code.
      - name: The installed command works
        run: |
          set -o pipefail
          slacken doctor | tee doctor.txt || true
          grep -q "claude on PATH" doctor.txt
          slacken help | grep -q "slacken agent install"

      - name: Uninstall cleanly
        run: |
          ./install.sh --uninstall
          if command -v slacken >/dev/null 2>&1; then
            echo "slacken should be gone after --uninstall"; exit 1
          fi
